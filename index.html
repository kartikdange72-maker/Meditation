<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Meditation Stopwatch</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

<style>
  body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f7fa;
    font-family:system-ui,sans-serif;
  }

  .stopwatch-container{
    width:360px;
    background:white;
    padding:30px;
    border-radius:24px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
    text-align:center;
  }

  .display{
    font-size:64px;
    font-weight:800;
    margin-bottom:20px;
    font-variant-numeric: tabular-nums;
  }

  .button-container{
    display:grid;
    gap:10px;
    grid-template-columns:1fr 1fr;
  }

  #start-button{
    grid-column:1 / -1;
  }

  .stats{
    margin-top:20px;
    font-size:18px;
    color:#555;
  }
</style>
</head>

<body>

<div class="stopwatch-container">

  <h2>Meditation Timer</h2>

  <div class="display" id="display">00:00</div>

  <div class="button-container">
    <button id="start-button" class="btn btn-primary">Start</button>
    <button id="pause-button" class="btn btn-success">Pause</button>
    <button id="reset-button" class="btn btn-danger">Reset</button>
  </div>

  <div class="stats">
    Voice Minute:
    <span id="interval-counter">0</span>
  </div>

</div>

<script>

const display = document.getElementById("display");
const startButton = document.getElementById("start-button");
const pauseButton = document.getElementById("pause-button");
const resetButton = document.getElementById("reset-button");
const intervalCounterDisplay = document.getElementById("interval-counter");

let timer = null;
let elapsedSeconds = 0;
let running = false;

let spokenCounter = 0;
let lastBellSecond = 0;
let audioContext = null;

const numberWords = {
  1:"One",
  2:"Two",
  3:"Three",
  4:"Four",
  5:"Five",
  6:"Six",
  7:"Seven",
  8:"Eight",
  9:"Nine",
  10:"Ten",
  11:"Eleven",
  12:"Twelve",
  13:"Thirteen",
  14:"Fourteen",
  15:"Fifteen",
  16:"Sixteen",
  17:"Seventeen",
  18:"Eighteen",
  19:"Nineteen",
  20:"Twenty"
};

function updateDisplay() {
  const minutes = Math.floor(elapsedSeconds / 60);
  const seconds = elapsedSeconds % 60;

  display.textContent =
    String(minutes).padStart(2, "0") +
    ":" +
    String(seconds).padStart(2, "0");
}

function speakText(text) {
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = 1;
  utterance.pitch = 1;
  utterance.volume = 1;
  speechSynthesis.speak(utterance);
}

function playMeditationBell() {

  const AudioContext = window.AudioContext || window.webkitAudioContext;

  if (!AudioContext) return;

  if (!audioContext) {
    audioContext = new AudioContext();
  }

  const now = audioContext.currentTime;

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = "sine";
  oscillator.frequency.setValueAtTime(528, now);

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.7, now + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start(now);
  oscillator.stop(now + 3);
}

function tick() {

  elapsedSeconds++;

  updateDisplay();

  const minutes = Math.floor(elapsedSeconds / 60);
  const seconds = elapsedSeconds % 60;

  // Meditation bell every 30 seconds
  if (
    elapsedSeconds > 0 &&
    elapsedSeconds % 30 === 0 &&
    elapsedSeconds !== lastBellSecond
  ) {
    lastBellSecond = elapsedSeconds;
    playMeditationBell();
  }

  // Voice every minute
  if (
    seconds === 0 &&
    minutes > 0 &&
    minutes > spokenCounter
  ) {
    spokenCounter = minutes;

    intervalCounterDisplay.textContent = spokenCounter;

    speakText(numberWords[spokenCounter] || String(spokenCounter));
  }
}

startButton.addEventListener("click", () => {

  if (running) return;

  running = true;

  timer = setInterval(tick, 1000);
});

pauseButton.addEventListener("click", () => {

  running = false;

  clearInterval(timer);
});

resetButton.addEventListener("click", () => {

  running = false;

  clearInterval(timer);

  elapsedSeconds = 0;
  spokenCounter = 0;
  lastBellSecond = 0;

  intervalCounterDisplay.textContent = "0";

  updateDisplay();
});

updateDisplay();

</script>

</body>
</html>
