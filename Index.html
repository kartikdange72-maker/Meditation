<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Smart Stopwatch</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --text: #101828;
      --muted: #667085;
      --border: #e4e7ec;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --danger: #dc2626;
      --shadow: 0 20px 55px rgba(16, 24, 40, 0.12);
      --radius: 28px;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
    }

    .app-shell {
      width: min(100%, 460px);
    }

    .stopwatch-container {
      width: 100%;
      padding: clamp(22px, 6vw, 34px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
    }

    h1 {
      margin: 0 0 22px;
      font-size: clamp(1.45rem, 6vw, 2rem);
      font-weight: 850;
      text-align: center;
      letter-spacing: -0.04em;
    }

    .timer-card {
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: clamp(20px, 6vw, 30px) 16px;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      text-align: center;
    }

    .display {
      margin: 0;
      color: var(--text);
      font-size: clamp(3.25rem, 16vw, 5.25rem);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.07em;
      font-variant-numeric: tabular-nums;
    }

    .status-text {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 600;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 18px 0;
    }

    .stat-box {
      padding: 14px 12px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      text-align: center;
    }

    .stat-label {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .stat-value {
      display: block;
      margin-top: 4px;
      font-size: 1.45rem;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .button-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .button-container .btn {
      min-height: 52px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 1rem;
      border: 0;
      box-shadow: none !important;
    }

    #start-button {
      grid-column: 1 / -1;
      background: var(--primary);
    }

    #start-button:hover,
    #start-button:focus {
      background: var(--primary-dark);
    }

    #pause-button { background: var(--success); }

    #reset-button { background: var(--danger); }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 650;
    }

    .form-check-input {
      width: 2.8em;
      height: 1.45em;
      cursor: pointer;
    }

    .form-check-input:checked {
      background-color: var(--primary);
      border-color: var(--primary);
    }

    .support-note {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.78rem;
      text-align: center;
    }

    @media (max-width: 380px) {
      body {
        padding-left: 10px;
        padding-right: 10px;
      }

      .button-container {
        grid-template-columns: 1fr;
      }

      #start-button {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>
  <main class="app-shell">
    <section class="stopwatch-container" aria-label="Smart stopwatch">
      <p class="eyebrow">Control mind, control life</p>
      <h1>Meditation</h1>

      <div class="timer-card">
        <h2 class="display" aria-live="polite">00:00</h2>
        <p class="status-text" id="status-text">Ready to start</p>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <span class="stat-label">Minute count</span>
          <span class="stat-value" id="counter">0</span>
        </div>

        <div class="stat-box">
          <span class="stat-label">State</span>
          <span class="stat-value" id="state-text">Idle</span>
        </div>
      </div>

      <div class="button-container">
        <button id="start-button" class="btn btn-primary" type="button">Start</button>
        <button id="pause-button" class="btn btn-secondary" type="button" disabled>Pause</button>
        <button id="reset-button" class="btn btn-danger" type="button">Reset</button>
      </div>

      <div class="options">
        <span>Speak every full minute</span>
        <div class="form-check form-switch m-0">
          <input class="form-check-input" type="checkbox" role="switch" id="voice-toggle" checked />
          <label class="visually-hidden" for="voice-toggle">Toggle voice announcements</label>
        </div>
      </div>

      <p class="support-note" id="wake-lock-note">
        Screen stays awake while timer is running on supported browsers.
      </p>
    </section>
  </main>

  <script>
    let elapsedBeforeStart = 0;
    let startTimestamp = null;
    let intervalId = null;
    let spokenCounter = 0;
    let lastDisplayedSecond = -1;
    let wakeLock = null;

    const timeDisplay = document.querySelector('.display');
    const intervalCounterDisplay = document.getElementById('counter');
    const stateText = document.getElementById('state-text');
    const statusText = document.getElementById('status-text');
    const startButton = document.getElementById('start-button');
    const pauseButton = document.getElementById('pause-button');
    const resetButton = document.getElementById('reset-button');
    const voiceToggle = document.getElementById('voice-toggle');
    const wakeLockNote = document.getElementById('wake-lock-note');

    const numberWords = {
      1: 'one',
      2: 'two',
      3: 'three',
      4: 'four',
      5: 'five',
      6: 'six',
      7: 'seven',
      8: 'eight',
      9: 'nine',
      10: 'ten',
      11: 'eleven',
      12: 'twelve',
      13: 'thirteen',
      14: 'fourteen',
      15: 'fifteen',
      16: 'sixteen',
      17: 'seventeen',
      18: 'eighteen',
      19: 'nineteen',
      20: 'twenty'
    };

    function pad(value) {
      return String(value).padStart(2, '0');
    }

    function getTotalElapsedSeconds() {
      if (startTimestamp === null) return elapsedBeforeStart;

      const runningSeconds = Math.floor((performance.now() - startTimestamp) / 1000);
      return elapsedBeforeStart + runningSeconds;
    }

    function updateDisplay(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;

      timeDisplay.textContent = `${pad(minutes)}:${pad(seconds)}`;
    }

    function updateState(state, status) {
      stateText.textContent = state;
      statusText.textContent = status;
    }

    function speakText(text) {
      if (!voiceToggle.checked || !('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel();

      const speech = new SpeechSynthesisUtterance(String(text));
      speech.lang = 'en-US';
      speech.volume = 1;
      speech.rate = 0.85;
      speech.pitch = 1;

      window.speechSynthesis.speak(speech);
    }

    async function keepScreenOn() {
      if (!('wakeLock' in navigator)) {
        wakeLockNote.textContent = 'Screen wake lock is not supported on this browser.';
        return;
      }

      if (wakeLock !== null) return;

      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLockNote.textContent = 'Screen wake lock is active while timer runs.';

        wakeLock.addEventListener('release', () => {
          wakeLock = null;
          wakeLockNote.textContent = 'Screen wake lock was released by the browser.';
        });
      } catch (error) {
        wakeLock = null;
        wakeLockNote.textContent = 'Screen wake lock needs HTTPS and browser support.';
        console.error('Wake Lock failed:', error);
      }
    }

    async function releaseScreenLock() {
      if (wakeLock === null) return;

      try {
        await wakeLock.release();
      } catch (error) {
        console.error('Wake lock release failed:', error);
      } finally {
        wakeLock = null;
        wakeLockNote.textContent = 'Screen stays awake while timer is running on supported browsers.';
      }
    }

    function tick() {
      const totalSeconds = getTotalElapsedSeconds();

      if (totalSeconds === lastDisplayedSecond) return;

      lastDisplayedSecond = totalSeconds;
      updateDisplay(totalSeconds);

      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;

      if (seconds === 0 && minutes > 0 && minutes > spokenCounter) {
        spokenCounter = minutes;
        intervalCounterDisplay.textContent = spokenCounter;
        speakText(numberWords[spokenCounter] || String(spokenCounter));
      }
    }

    startButton.addEventListener('click', async () => {
      if (intervalId) return;

      await keepScreenOn();

      startTimestamp = performance.now();
      intervalId = setInterval(tick, 100);
      tick();

      startButton.disabled = true;
      pauseButton.disabled = false;
      updateState('Running', 'Timer is running');
    });

    pauseButton.addEventListener('click', async () => {
      if (!intervalId) return;

      elapsedBeforeStart = getTotalElapsedSeconds();
      clearInterval(intervalId);

      intervalId = null;
      startTimestamp = null;

      await releaseScreenLock();

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      startButton.disabled = false;
      pauseButton.disabled = true;
      updateState('Paused', 'Timer is paused');
    });

    resetButton.addEventListener('click', async () => {
      clearInterval(intervalId);

      intervalId = null;
      elapsedBeforeStart = 0;
      startTimestamp = null;
      spokenCounter = 0;
      lastDisplayedSecond = -1;

      await releaseScreenLock();

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      updateDisplay(0);
      intervalCounterDisplay.textContent = '0';
      startButton.disabled = false;
      pauseButton.disabled = true;
      updateState('Idle', 'Ready to start');
    });

    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible' && intervalId) {
        await keepScreenOn();
      }
    });
  </script>
</body>
</html>
